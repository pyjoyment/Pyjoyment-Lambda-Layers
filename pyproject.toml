[project]
name = "Pyjoyment-Lambda-Layers"
version = "0"
description = "Public AWS Lambda layers of Pyjoyment and of Python."
readme = "README.md"
license = "Artistic-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Piotr Roszatycki", email = "piotr.roszatycki@gmail.com" }]
requires-python = ">=3.12"
# The Pyjoyment of the layers, which Renovate bumps in uv.lock
dependencies = ["Pyjoyment>=0.1.0"]

# Not a package: the repository builds and publishes the layers, and installs nothing of its own
[tool.uv]
package = false

# TODO: Pyjoyment of PyPI again with the release after 0.1.0, whose generate lambda-zip installs the Python of the
# machine; until then the commit of Git that has it, pinned, so that the layers have no other change that is not
# released
[tool.uv.sources]
Pyjoyment = { git = "https://github.com/pyjoyment/Pyjoyment", rev = "b6095f6dcca42917ba1dac5fd9317345ea26a21e" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

# The rules of Pyjoyment, whose conventions this repository follows.
[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test scripts import all test functions, like `use Test::More` in Perl.
"t/**" = [
  # F403 "`from Pyjo.Test import *` used; unable to detect undefined names"
  "F403",
  # F405 "`ok` may be undefined, or defined from star imports"
  "F405",
]

[tool.ruff.lint.isort]
# Pyjo modules first, then the standard library, then the others, as in Pyjoyment.
known-first-party = ["Pyjo", "Pyjoyment"]
section-order = [
  "future",
  "first-party",
  "local-folder",
  "standard-library",
  "third-party",
]
lines-between-types = 1
lines-after-imports = 2

# The environment of uv sync, where Pyjoyment is, for pyright of Trunk too
[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "off"
strict = ["Pyjo/**", "layers.py"]
