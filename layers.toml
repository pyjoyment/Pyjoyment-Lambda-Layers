# The versions of Python of the layers, "t" for the free-threaded build, as
# the option --python of "generate lambda-zip" takes them
python = ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]

# The architectures of AWS Lambda
architectures = ["arm64", "x86_64"]

# The runtimes of Python of AWS Lambda, which the layer of Pyjoyment of the same
# version serves too, where Lambda takes them as CompatibleRuntimes
runtimes = ["python3.12", "python3.13", "python3.14"]
