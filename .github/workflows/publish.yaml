name: Publish

# A pull request and a dispatch in the mode dry-run show what the publication
# would do, with the role that only reads; the schedule and a dispatch on main
# publish, with the role of the environment publishing, which takes main only.
on:
  pull_request:
    branches:
      - "*"
    paths:
      - .github/workflows/publish.yaml
      - LambdaLayers/**
      - layers.py
      - layers.toml
      - mise.lock
      - mise.toml
      - pyproject.toml
      - uv.lock
  schedule:
    - cron: 17 5 * * 1
  workflow_dispatch:
    inputs:
      mode:
        description: Publish the layers, or show what the publication would do
        type: choice
        options:
          - publish
          - dry-run
        default: publish

permissions:
  contents: read

# Two publications never run at once, and a pull request waits for its own
# run before
concurrency:
  group: publish-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  matrix:
    name: Matrix

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.7 # datasource=github-releases depName=jdx/mise

      - name: Install
        run: uv sync

      - name: Matrix of layers.toml
        id: matrix
        run: echo "matrix=$(uv run python layers.py matrix)" >> "$GITHUB_OUTPUT"

  # Each job builds and publishes the layer of Python of its version and
  # architecture, and the layer of Pyjoyment of its version on the first
  # architecture, in every region in turn. The token of OIDC of a pull request
  # of a fork has no role to assume, so it has no dry run.
  publish:
    name: ${{ (github.event_name == 'pull_request' || inputs.mode == 'dry-run') && 'dry run' || 'publish' }} (python ${{ matrix.python }}, ${{ matrix.arch }})

    needs: matrix
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    environment: ${{ github.event_name != 'pull_request' && inputs.mode != 'dry-run' && 'publishing' || '' }}

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      APPLY: ${{ github.event_name != 'pull_request' && inputs.mode != 'dry-run' && '1' || '' }}
      # The log of the commands without the time and the process, which the log of GitHub Actions has
      PYJO_LOG_FORMAT: plain

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.7 # datasource=github-releases depName=jdx/mise

      - name: Install
        run: uv sync

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
          PYTHON: ${{ matrix.python }}
        run: uv run python layers.py build --python "$PYTHON" --arch "$ARCH"

      - name: Credentials of AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::959435416781:role/Pyjoyment-Lambda-Layers-${{ env.APPLY && 'publishing' || 'dry-run' }}
          aws-region: us-east-1

      - name: Publish
        env:
          ARCH: ${{ matrix.arch }}
          PYTHON: ${{ matrix.python }}
        run: uv run python layers.py publish --python "$PYTHON" --arch "$ARCH" ${APPLY:+--apply}

      - name: Upload the ARNs
        if: env.APPLY
        uses: actions/upload-artifact@v7
        with:
          name: arns-python${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*.json
          if-no-files-found: error
          retention-days: 90

  # The ARNs of the latest versions of every layer in every region, as one
  # index, {layer: {region: arn}}, released when it differs from the one of
  # the latest release, with a tag of the version of Pyjoyment and the date,
  # so that releases/latest/download/layers.json is the index of the layers
  index:
    name: Index

    needs: publish
    if: github.event_name != 'pull_request' && inputs.mode != 'dry-run'

    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      # The log of the commands without the time and the process, which the log of GitHub Actions has
      PYJO_LOG_FORMAT: plain

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.7 # datasource=github-releases depName=jdx/mise

      - name: Install
        run: uv sync

      - name: Download the ARNs
        uses: actions/download-artifact@v8
        with:
          pattern: arns-*
          merge-multiple: true
          path: arns

      - name: Index of the latest release
        run: |
          if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern layers.json --output latest.json; then
            echo '{}' > latest.json
          fi

      # notes.md only when the layers have new versions or new regions
      - name: Index of the layers
        run: |
          uv run python layers.py index --latest latest.json --notes notes.md arns
          cat notes.md >> "$GITHUB_STEP_SUMMARY" 2> /dev/null || echo 'The layers of the latest release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the index
        uses: actions/upload-artifact@v7
        with:
          name: layers
          path: layers.json
          if-no-files-found: error
          retention-days: 90

      # The tag of the version of Pyjoyment and the date, as its build
      # metadata, with a number of the day for another release of the same
      # day. Latest explicitly, which GitHub otherwise takes from the highest
      # semantic version too, as 2026.11.05 of the tags of the date alone.
      - name: Release
        run: |
          if [[ ! -f notes.md ]]; then
            exit 0
          fi
          version=$(uv run python -c 'import importlib.metadata; print(importlib.metadata.version("Pyjoyment"))')
          day=$(date -u +%Y.%m.%d)
          tag="$version+$day"
          number=1
          while gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            number=$((number + 1))
            tag="$version+$day.$number"
          done
          gh release create "$tag" layers.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md --latest
